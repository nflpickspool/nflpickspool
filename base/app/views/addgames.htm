      <div class="be-content">
        <div class="page-head">
          <h2 class="page-head-title">Add Games</h2>
        </div>
        <div class="main-content container-fluid">
	  <div class="col-md-12">
	    <div class="card card-border-color card-border-color-primary">
	      <form method="POST" action="/addgame">
		<table class="table">
		  <thead>
		    <tr>
                      <th style="width:6%;">Year</th>
                      <th style="width:5%;">Week</th>
                      <th style="width:10%;">Time</th>
                      <th class="text-center" style="width:5%;">Network</th>
                      <th style="width:10%;">Away</th>
                      <th style="width:10%;">Home</th>
                      <th style="width:10%;">Favorite</th>
                      <th class="text-center" style="width:10%;">Point Spread</th>
                      <th class="text-center" style="width:10%;">Money Line</th>
                      <th class="text-center" style="width:10%;">Total Points O/U</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr>
		      <td><input class="form-control" type="number" value="{{ @recentlyAddedGames[0].league_year }}" id="league_year" name="league_year"></td>
		      <td><input class="form-control" type="number" value="{{ @recentlyAddedGames[0].league_week }}" id="league_week" name="league_week"></td>
		      <td><input class="form-control" type="datetime" value="{{ @recentlyAddedGames[0].kickoff_time }}" id="kickoff_time" name="kickoff_time"></td>
		      <td align="center">
		      	<select class="form-control" type="text" value="" name="network">
			  <option>CBS</option>
			  <option>FOX</option>
			  <option>ESPN</option>
			  <option>NBC</option>
			  <option>NFL</option>
			</select>
		      </td>
		      <td>
			<select class="form-control" name="away" id="away">
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}">{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td>
			<select class="form-control" name="home" id="home">
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}">{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td>
		      	<select class="form-control" name="favorite" id="favorite">
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}">{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td><input class="form-control" type="number" value="0" step="0.5" id="point_spread" name="point_spread"></td>
		      <td><input class="form-control" type="number" value="0" step="0.1" id="money_line" name="money_line"></td>
		      <td><input class="form-control" type="number" value="0" step="0.5" id="ou" name="ou"></td>
		    </tr>
		  </tbody>
		</table>
	        <button type="submit" class="btn btn-primary btn-block">Submit</button>
	      </form>
            </div>
	    <div class="card card-border-color card-border-color-primary">
	      <form method="POST" action="/updategame">
              <table class="table">
		<thead>
		  <tr>
                    <th style="width:6%;">Year</th>
                    <th style="width:5%;">Week</th>
                    <th style="width:12%;">Time</th>
                    <th class="text-center" style="width:6%;">Network</th>
                    <th style="width:10%;">Away</th>
                    <th style="width:10%;">Home</th>
                    <th style="width:10%;">Favorite</th>
                    <th class="text-center" style="width:10%;">Point Spread</th>
                    <th class="text-center" style="width:10%;">Money Line</th>
                    <th class="text-center" style="width:10%;">Total Points O/U</th>
	            <th class="text-center" style="width:10%;">Edit</th>
		  </tr>
		</thead>
		<tbody>
		  <repeat group="{{ @recentlyAddedGames }}" value="{{ @game }}" key="{{@i}}">
		    <tr>
		      <input type="hidden" name="id[{{ @i }}]" id="id{{ @i }}" value="{{ @game.id }}" disabled>
		      <td><input class="form-control" type="number" value="{{ @game.league_year }}" id="league_year{{@i}}" name="league_year[{{ @i }}]" disabled></td>
		      <td><input class="form-control" type="number" value="{{ @game.league_week }}" id="league_week{{@i}}" name="league_week[{{ @i }}]" disabled></td>
		      <td><input class="form-control" type="datetime" value="{{ @game.kickoff_time }}" id="kickoff_time{{@i}}" name="kickoff_time[{{ @i }}]" disabled></td>
		      		      <td align="center">
		      	<select class="form-control" type="text" value="" name="network[{{ @i }}]" id="network{{@i}}" disabled>
			  <option <check if="{{@game.network == 'CBS'}}"><true>selected</true></check>>CBS</option>
			  <option <check if="{{@game.network == 'FOX'}}"><true>selected</true></check>>FOX</option>
			  <option <check if="{{@game.network == 'ESPN'}}"><true>selected</true></check>>ESPN</option>
			  <option <check if="{{@game.network == 'NBC'}}"><true>selected</true></check>>NBC</option>
			  <option <check if="{{@game.network == 'NFL'}}"><true>selected</true></check>>NFL</option>
			</select>
		      </td>
		      <td>
			<select class="form-control" name="away[{{ @i }}]" id="away{{@i}}" disabled>
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}"
				    <check if="{{ @game.away == @team.team}}">
				      <true>selected</true>
				    </check>
				    >{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td>
			<select class="form-control" name="home[{{ @i }}]" id="home{{@i}}" disabled>
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}"
				    <check if="{{ @game.home == @team.team}}">
				      <true>selected</true>
				    </check>
				    >{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td>
		      	<select class="form-control" name="favorite[{{ @i }}]" id="favorite{{@i}}" disabled>
			  <repeat group="{{ @teams }}" value="{{ @team }}">
			    <option value="{{ @team.id }}"
				    <check if="{{ @game.favorite == @team.team}}">
				      <true>selected</true>
				    </check>
				    >{{ @team.team }}</option>
			  </repeat>
			</select>
		      </td>
		      <td><input class="form-control" type="number" value="{{ @game.point_spread }}" step="0.5" id="point_spread{{@i}}" name="point_spread[{{ @i }}]" disabled></td>
		      <td><input class="form-control" type="number" value="{{ @game.money_line }}" step="0.1" id="money_line{{@i}}" name="money_line[{{ @i }}]" disabled></td>
		      <td><input class="form-control" type="number" value="{{ @game.ou }}" step="0.5" id="ou{{@i}}" name="ou[{{ @i }}]" disabled></td>
		      <td align="center">
			<div id="edit{{@i}}">
			  <button type="button" class="btn btn-primary" onclick="updateGame({{@i}})"><i class="icon mdi mdi-edit"></i></button>
			</div>
		      </td>
		    </tr>
		  </repeat>
		</tbody>
              </table>
	      <div id="update_btn" style="display:none">
		<button type="submit" class="btn btn-primary btn-block">Update</button>
	      </div>
	      </form>
            </div>
	  </div>
        </div>
      </div>
    </div>
     <script>
	function updateGame(row_num) {
	document.getElementById("edit"+row_num).style.display = "none";
	document.getElementById("id"+row_num).disabled = false;
	document.getElementById("league_year"+row_num).disabled = false;
	document.getElementById("league_week"+row_num).disabled = false;
	document.getElementById("kickoff_time"+row_num).disabled = false;
	document.getElementById("network"+row_num).disabled = false;
	document.getElementById("away"+row_num).disabled = false;
	document.getElementById("home"+row_num).disabled = false;	
	document.getElementById("favorite"+row_num).disabled = false;	
	document.getElementById("point_spread"+row_num).disabled = false;	
	document.getElementById("money_line"+row_num).disabled = false;	
	document.getElementById("ou"+row_num).disabled = false;
	document.getElementById('update_btn').style.display = "block";
	}
      </script>
